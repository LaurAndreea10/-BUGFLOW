name: Validate BUGFLOW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required assets
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
      - name: Check local references
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'manifest.webmanifest' index.html

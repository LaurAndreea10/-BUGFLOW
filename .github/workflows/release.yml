name: Publish v9 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v9.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v9.0.0 >/dev/null 2>&1; then
            echo "v9.0.0 already exists"
          else
            gh release create v9.0.0 --target "$GITHUB_SHA" --title "BUGFLOW v9.0.0 — Production Studio" --notes-file - <<'EOF'
          BUGFLOW v9 introduces the Production Center, graph analysis, smart share links, local collaboration, accessible presentation, command palette, new Mermaid starters, mobile tools, CodeQL, Dependabot, axe, Playwright, and Lighthouse automation.

          The app remains free, local-first, bilingual, accessible, installable, and compatible with GitHub Pages.
          EOF
